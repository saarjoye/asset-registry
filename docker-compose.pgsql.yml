services:
  backend:
    image: asset-registry-backend:latest
    build:
      context: https://github.com/saarjoye/asset-registry.git#main:backend
    container_name: work-asset-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: "replace-with-your-postgres-host"
      DB_PORT: "5432"
      DB_NAME: "work_device_registry"
      DB_USERNAME: "replace-with-your-postgres-user"
      DB_PASSWORD: "replace-with-your-postgres-password"
      TZ: Asia/Shanghai
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://127.0.0.1:8080/api/archive/departments || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 40s

  frontend:
    image: asset-registry-frontend:latest
    build:
      context: https://github.com/saarjoye/asset-registry.git#main:frontend
    container_name: work-asset-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    ports:
      - "5173:80"
