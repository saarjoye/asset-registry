services:
  backend:
    image: ghcr.io/${GHCR_OWNER:-saarjoye}/asset-registry-backend:latest
    container_name: work-asset-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: dev
      TZ: Asia/Shanghai
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - backend-data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://127.0.0.1:8080/api/archive/departments || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 40s

  frontend:
    image: ghcr.io/${GHCR_OWNER:-saarjoye}/asset-registry-frontend:latest
    container_name: work-asset-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    ports:
      - "${FRONTEND_PORT:-5173}:80"

volumes:
  backend-data:
